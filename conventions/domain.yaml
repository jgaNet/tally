# The domain, as data: the subdomains and their kind, each bounded context with its purpose and its
# language, and the context map — every relationship between two contexts, the pattern it follows,
# the mechanism that carries it and why. The conventions check holds it to the binding (a context
# declared there is described here) and to the code (a link between two contexts that this map does
# not declare is refused, and so is a relationship nothing carries: CTX-MAP-DECLARED). It starts
# with the contexts this application was created with, described as the reference describes them;
# each context of your own is described here when it is declared in the binding.
# `clean-ddd rule CTX-MAP-DECLARED` explains the rule; `clean-ddd concept context-map` the idea.
schemaVersion: 1
name: tally
purpose: >-
  Tally lets a group of people share expenses: someone pays, the expense is split between the members it concerns,
  and Tally keeps what each member owes or is owed, so that the group's balances always sum to zero and nobody pays
  more than is owed; members settle up with each other, and Tally takes no commission.
subdomains:
  - id: ledger
    name: The ledger
    kind: core
    why: >-
      Keeping what each member owes or is owed, exactly, after any sequence of expenses, edits and deletions, with
      the balances of a group always summing to zero: this is what Tally is for.
    contexts:
      - Ledger
  - id: groups
    name: Groups
    kind: supporting
    why: >-
      Who is in a group, with which role, and who may be in a split: what the ledger needs to know about people,
      and nothing a group of friends would compete on.
    contexts:
      - Groups
  - id: operations
    name: Operations
    kind: generic
    why: >-
      Every command is accepted first and answered later; recording each operation and letting a client follow
      it to its outcome is plumbing any asynchronous application needs, and has no domain of its own.
    contexts:
      - Tracker
  - id: settling
    name: Settling up
    kind: core
    why: >-
      Bringing balances to zero without anyone paying more than is owed, in cash or through a provider whose
      webhooks come late, twice or out of order: the money invariant Tally is for, held where two settlements can
      be decided at once.
    contexts:
      - Settlements
  - id: telling
    name: Telling people
    kind: generic
    why: >-
      Telling a member an expense concerns them, reminding one who has owed for a week, and telling everyone when a
      month passes a budget, is plumbing any application needs.
    contexts:
      - Notifications
contexts:
  - id: Groups
    purpose: >-
      Who someone is and which groups they are in: accounts, groups with their fixed currency, invitations by a link,
      the members in their join order with their role, and who leaves.
    language:
      - term: Account
        meaning: one signed-in person, known by an email, with one name in every group.
      - term: Group
        meaning: people who share expenses in one currency, fixed when the group is created, owned by its creator.
      - term: Member
        meaning: an account in a group, from the moment it joined, with the role owner or member.
      - term: Invitation
        meaning: a link, generated by the domain, that lets anyone who holds it join a group.
  - id: Ledger
    purpose: >-
      The expenses of each group, how each is split between its members, and what each member owes or is owed:
      recorded as decided, never computed again at a read, the balances summing to zero by construction.
    language:
      - term: Expense
        meaning: an amount a member paid for some members of the group, with its split, kept as it was recorded; in the group's currency, or in another one at the rate its payer gave, kept with it (request 21).
      - term: Split
        meaning: how an expense's amount is shared, equally, by exact amounts or by shares, the remainder to a stated member.
      - term: Share
        meaning: what one member of a split owes of an expense, whole, the shares adding up to the amount exactly.
      - term: Balance
        meaning: what a member owes, or is owed, in a group, read from the expenses' shares and payers.
      - term: Category
        meaning: what an expense is filed under, one of eight, `other` when none is given (request 24).
      - term: Budget
        meaning: the owner's monthly limit on one category of a group, in the group's currency; a month that spends more than it is told once (request 24, ADR 17).
  - id: Tracker
    purpose: >-
      What became of each command: every operation the bus dispatches is recorded with its outcome, so that a
      caller answered 202 can follow it to success or refusal.
    language:
      - term: Operation
        meaning: one dispatch of one command or event, with its public name, its status and its result or error.
      - term: Outcome
        meaning: how an operation ended — SUCCESS with its result, or ERROR with the refusal.
      - term: Trace
        meaning: the id that ties an operation to the request that asked for it and to the operations it caused.
  - id: Settlements
    purpose: >-
      Settling up between members: the settlements of each group decided in one book, in cash or through the payment
      provider, their payments, refunds and statuses, and each person's payout account at the provider.
    language:
      - term: Settlement
        meaning: one transfer from a payer to a payee of a group, decided against what is owed at that moment, never more.
      - term: SettlementBook
        meaning: the one place every settlement of a group is decided in, cash and provider alike, so that two at once cannot overpay.
      - term: Payment
        meaning: a settlement paid through the provider, pending until its webhook lands, counted once whatever the webhooks do.
      - term: PayoutAccount
        meaning: the account at the provider a person is paid on; required to be paid through the provider.
  - id: Notifications
    purpose: >-
      Telling members what concerns them: one notice per member when an expense includes them, a reminder, at the
      next sweep, to a member who has owed more than a threshold for a week, once a week, and one per member when a
      month passes a budget.
    language:
      - term: Notice
        meaning: one message owed to one member about one fact, made once from the fact.
      - term: Reminder
        meaning: a notice the sweep makes for a lasting debt, at most once a week per member and group.
      - term: Debt
        meaning: what a member still owes in a group, counted as the suggestions count it (payments waiting at the provider as paid), over 2000.
      - term: DebtWatch
        meaning: the sweep's record of one member's debt in one group, since which run it was seen, and when it was last reminded.
relationships:
  - upstream: Groups
    downstream: Ledger
    patterns: [customer-supplier, anti-corruption-layer]
    mechanism: owned-port
    why: >-
      Only a member of the group may be in a split, and only Groups knows who is a member now, in which order, with
      which role, and who has ever been one, and what a member who left passed to the owner. Ledger asks in its own
      words, through a port it owns (GroupMembers), when it decides or reads a balance, so that a member who has just
      joined can be in a split at once (T3) and the balances count what passed (ADR 13). Carried since request 4, its
      answer read over Groups' read model that Groups' wiring exports (ADR 3). An expense paid in another currency is
      converted into the group's, so Ledger also asks for the group's currency, through a port it owns (GroupCurrency),
      when it decides such an expense: the currency Groups made the group in, read inside the command's transaction
      (ADR 14).
  - upstream: Ledger
    downstream: Groups
    patterns: [customer-supplier, anti-corruption-layer]
    mechanism: owned-port
    why: >-
      A member leaves a group with whatever balance it has, which passes to the owner in the same step, and only Ledger
      knows the balances. Groups asks through a port it owns (MemberBalances) when it decides, answered over Ledger's
      balance read model that Ledger's wiring exports for a command, and the two wirings do not import each other:
      Bootstrap hands Groups the port. Two ports in opposite directions, each in the asking side's words, and no domain
      imports the other (T5, ADR 4, ADR 13).
  - upstream: Ledger
    downstream: Settlements
    patterns: [customer-supplier, anti-corruption-layer]
    mechanism: owned-port
    why: >-
      A settlement is decided against what is owed now, and only Ledger knows the balances. Settlements asks through a
      port it owns (GroupBalances) when its book decides, and for the suggestions (T7).
  - upstream: Groups
    downstream: Settlements
    patterns: [customer-supplier, anti-corruption-layer]
    mechanism: owned-port
    why: >-
      Only members of the group settle with each other, and only Groups knows who is a member. Settlements asks
      through a port it owns (SettlementMembers). A payment through the provider is asked in the group's currency, which
      only Groups knows, so Settlements asks for it through a port it owns too (GroupCurrency, ADR 8).
  - upstream: Settlements
    downstream: Ledger
    patterns: [customer-supplier, anti-corruption-layer]
    mechanism: owned-port
    why: >-
      A balance never misses a settlement that is paid: Ledger reads what was settled through a port it owns
      (SettledAmounts), answered over Settlements' read model, when it reads a balance, inside the transaction of a
      command that decides on it (T8, ADR 7).
  - upstream: Ledger
    downstream: Notifications
    patterns: [published-language, anti-corruption-layer]
    mechanism: integration-event
    why: >-
      A member is told when an expense concerns them. Ledger says it in its public words (ExpenseRecorded, Tally's
      first integration event), through the outbox; Notifications turns it into one notice per member and delivers
      it, which keeps the telling out of the ledger's transactions (T9). A month that passes a budget is said the same
      way (BudgetPassed, ADR 17): the same relationship carries one more contract, not a new one.
  - upstream: Settlements
    downstream: Groups
    patterns: [customer-supplier, anti-corruption-layer]
    mechanism: owned-port
    why: >-
      A member leaves a group with whatever balance it has, but not while a payment of theirs waits at the provider: a
      payment that lands after they left would change a former member's balance. Groups asks through a port it owns
      (WaitingPayments) when a member leaves, inside the leave's transaction, answered over Settlements' read side that
      its wiring exports, so that a payment decided at the same moment is either counted or refused (ADR 13).
  - upstream: Settlements
    downstream: Notifications
    patterns: [customer-supplier, anti-corruption-layer]
    mechanism: owned-port
    why: >-
      A reminder is for a debt that lasts, and only Settlements knows what each member still owes once the paid
      settlements count and the payments waiting at the provider count as paid. Notifications' sweep asks through a
      port it owns (OutstandingDebts), answered over Settlements' read side that its wiring exports, and the sweep
      itself is a job of Notifications, not a read (T9, ADR 12).
