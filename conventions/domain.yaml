# The domain, as data: the subdomains and their kind, each bounded context with its purpose and its
# language, and the context map — every relationship between two contexts, the pattern it follows,
# the mechanism that carries it and why. The conventions check holds it to the binding (a context
# declared there is described here) and to the code (a link between two contexts that this map does
# not declare is refused, and so is a relationship nothing carries: CTX-MAP-DECLARED). It starts
# with the contexts this application was created with, described as the reference describes them;
# each context of your own is described here when it is declared in the binding.
# `clean-ddd rule CTX-MAP-DECLARED` explains the rule; `clean-ddd concept context-map` the idea.
schemaVersion: 1
name: tally
purpose: >-
  Tally lets a group of people share expenses: someone pays, the expense is split between the members it concerns,
  and Tally keeps what each member owes or is owed, so that the group's balances always sum to zero and nobody pays
  more than is owed; members settle up with each other, and Tally takes no commission.
subdomains:
  - id: ledger
    name: The ledger
    kind: core
    why: >-
      Keeping what each member owes or is owed, exactly, after any sequence of expenses, edits and deletions, with
      the balances of a group always summing to zero: this is what Tally is for.
    contexts:
      - Ledger
  - id: groups
    name: Groups
    kind: supporting
    why: >-
      Who is in a group, with which role, and who may be in a split: what the ledger needs to know about people,
      and nothing a group of friends would compete on.
    contexts:
      - Groups
  - id: settling
    name: Settling up
    kind: core
    why: >-
      Bringing balances to zero without anyone paying more than is owed, in cash or through a provider whose
      webhooks come late, twice or out of order: the money invariant Tally is for, held where two settlements can
      be decided at once.
    contexts:
      - Settlements
  - id: telling
    name: Telling people
    kind: generic
    why: >-
      Telling a member an expense concerns them, and reminding one who has owed for a week, is plumbing any
      application needs.
    contexts:
      - Notifications
contexts:
  - id: Groups
    purpose: >-
      Who someone is and which groups they are in: accounts, groups with their fixed currency, invitations by a link,
      the members in their join order with their role, and who leaves.
    language:
      - term: Account
        meaning: one signed-in person, known by an email, with one name in every group.
      - term: Group
        meaning: people who share expenses in one currency, fixed when the group is created, owned by its creator.
      - term: Member
        meaning: an account in a group, from the moment it joined, with the role owner or member.
      - term: Invitation
        meaning: a link, generated by the domain, that lets anyone who holds it join a group.
  - id: Ledger
    purpose: >-
      The expenses of each group, how each is split between its members, and what each member owes or is owed:
      recorded as decided, never computed again at a read, the balances summing to zero by construction.
    language:
      - term: Expense
        meaning: an amount a member paid for some members of the group, with its split, kept as it was recorded.
      - term: Split
        meaning: how an expense's amount is shared, equally, by exact amounts or by shares, the remainder to a stated member.
      - term: Share
        meaning: what one member of a split owes of an expense, whole, the shares adding up to the amount exactly.
      - term: Balance
        meaning: what a member owes, or is owed, in a group, read from the expenses' shares and payers.
      - term: OriginalAmount
        meaning: what an expense was paid in another currency, at the rate its payer states, kept as given; converted to the group's currency, a half up.
      - term: RecurringExpense
        meaning: an expense a member pays every month, with its split as given, whose expense the background job records on each day of the month that has come, from its start, once.
  - id: Settlements
    purpose: >-
      Settling up between members: the settlements of each group decided in one book, in cash or through the payment
      provider, their payments, refunds and statuses, and each person's payout account at the provider.
    language:
      - term: Settlement
        meaning: one transfer from a payer to a payee of a group, decided against what is owed at that moment, never more.
      - term: SettlementBook
        meaning: the one place every settlement of a group is decided in, cash and provider alike, so that two at once cannot overpay.
      - term: Payment
        meaning: a settlement paid through the provider, pending until its webhook lands, counted once whatever the webhooks do.
      - term: PayoutAccount
        meaning: the account at the provider a person is paid on; required to be paid through the provider.
  - id: Notifications
    purpose: >-
      Telling members what concerns them: one notice per member when an expense includes them, and a reminder, at the
      next sweep, to a member who has owed more than a threshold for a week, once a week.
    language:
      - term: Notice
        meaning: one message owed to one member about one fact, made once from the fact.
      - term: Reminder
        meaning: a notice the sweep makes for a lasting debt, at most once a week per member and group.
relationships:
  - upstream: Groups
    downstream: Ledger
    patterns: [customer-supplier, anti-corruption-layer]
    mechanism: owned-port
    why: >-
      Only a member of the group may be in a split, and only Groups knows who is a member now, in which order, with
      which role, and who has ever been one. Ledger asks in its own words, through a port it owns (GroupMembers), when
      it decides, so that a member who has just joined can be in a split at once (T3). It asks the group's currency
      too, through a port beside it (GroupCurrency): an expense paid in another currency is converted to it (request 21,
      ADR 16).
  - upstream: Ledger
    downstream: Groups
    patterns: [customer-supplier, anti-corruption-layer]
    mechanism: owned-port
    why: >-
      A member leaves a group whatever their balance, and what they owe or are owed passes to the owner in the same
      step; only Ledger knows the balances. Groups asks through a port it owns (MemberBalances) when it decides: two
      ports in opposite directions, each in the asking side's words, and no domain imports the other (T5, ADR 15).
  - upstream: Settlements
    downstream: Groups
    patterns: [customer-supplier, anti-corruption-layer]
    mechanism: owned-port
    why: >-
      A member may not leave while a payment of theirs waits at the provider (pending or refunding), and only
      Settlements knows which payments wait. Groups asks through a port it owns (WaitingPayments) when it decides, so
      that a payment that lands after its payer left never changes a former member's balance (ADR 15).
  - upstream: Ledger
    downstream: Settlements
    patterns: [customer-supplier, anti-corruption-layer]
    mechanism: owned-port
    why: >-
      A settlement is decided against what is owed now, and only Ledger knows the balances. Settlements asks through a
      port it owns (GroupBalances) when its book decides, and for the suggestions (T7, ADR 9).
  - upstream: Groups
    downstream: Settlements
    patterns: [customer-supplier, anti-corruption-layer]
    mechanism: owned-port
    why: >-
      Only members of the group settle with each other, and only Groups knows who is a member. Settlements asks
      through a port it owns (SettlementMembers), in the order they joined (ADR 9).
  - upstream: Settlements
    downstream: Ledger
    patterns: [customer-supplier, anti-corruption-layer]
    mechanism: owned-port
    why: >-
      A balance never misses a settlement that is paid: Ledger reads what was settled through a port it owns
      (SettledAmounts), answered over Settlements' read model, when it reads a balance (T8, ADR 10).
  - upstream: Ledger
    downstream: Notifications
    patterns: [published-language, anti-corruption-layer]
    mechanism: integration-event
    why: >-
      A member is told when an expense concerns them. Ledger says it in its public words (ExpenseRecorded, Tally's
      first integration event), through the outbox; Notifications turns it into one notice per member and delivers
      it, which keeps the telling out of the ledger's transactions (T9).
  - upstream: Settlements
    downstream: Notifications
    patterns: [customer-supplier, anti-corruption-layer]
    mechanism: owned-port
    why: >-
      A reminder is for a debt that lasts, and only Settlements knows what each member still owes once the paid
      settlements count. Notifications' sweep asks through a port it owns (OutstandingDebts), answered over Settlements'
      read model, with the payments waiting at the provider counted as paid (T9, ADR 14).
