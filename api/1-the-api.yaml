# The first fragment of this application's API (ADR 45 of the reference), written by `clean-ddd create`.
# A command is answered `202 { operationId }` (`accepted`) and its outcome read at the Tracker (`operation`, the
# contract's `http.operation`); a refusal is a `4xx`. A `5xx` is never an answer a route gives.
# Each change adds its fragment after this one (`api/2-<name>.yaml`) before its code: api/README.md says how.
resources:
  refusal:
    schema:
      type: object
      required:
        - message
      properties:
        message:
          type: string
  accepted:
    schema:
      type: object
      required:
        - operationId
      properties:
        operationId:
          type: string
  operation:
    schema:
      type: object
      required:
        - id
        - name
        - status
        - traceId
        - createdAt
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
          description: 'The public name: the intent or the fact without the suffix of its kind (API-ONE-SURFACE).'
        status:
          enum:
            - PENDING
            - SUCCESS
            - ERROR
            - SENT
        traceId:
          type: string
        subjectId:
          type: string
          description: The account that asked, when the request was authenticated.
        result:
          description: 'What the handler answered on success: any JSON value.'
        error:
          type: object
          description: The refusal, in the client's words — the rule's exception (`type`) and its message.
          required:
            - type
            - message
          additionalProperties: false
          properties:
            type:
              type: string
            message:
              type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          description: 'Once the command is decided: SUCCESS or ERROR.'
      allOf:
        - if:
            properties:
              status:
                const: ERROR
            required:
              - status
          then:
            required:
              - error
              - finishedAt
          else:
            not:
              required:
                - error
        - if:
            properties:
              status:
                const: SUCCESS
            required:
              - status
          then:
            required:
              - finishedAt
          else:
            not:
              required:
                - result
all_routes:
  '202': accepted
  4xx: refusal
routes:
  GET /v1/tracker/operations:
    '200':
      type: array
      items:
        $resource: operation
  GET /v1/tracker/operations/{id}:
    '200': operation
